version: '3.8'

services:
  api-nomina:
    build: .
    container_name: api_nomina_prod
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - TZ=America/Guayaquil
      - SPRING_PROFILES_ACTIVE=prod
      - GCP_PROJECT_ID=${GCP_PROJECT_ID}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"