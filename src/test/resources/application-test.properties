# Configuración para tests de integración
spring.application.name=apiNomina-test

# Deshabilitar Secret Manager en tests
spring.cloud.gcp.project-id=test-project
spring.config.import=

# Base de datos en memoria H2 para tests
spring.datasource.rrhh.jdbc-url=jdbc:h2:mem:rrhhdb;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.rrhh.username=sa
spring.datasource.rrhh.password=
spring.datasource.rrhh.driver-class-name=org.h2.Driver

spring.datasource.seguridad.jdbc-url=jdbc:h2:mem:seguridaddb;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.seguridad.username=sa
spring.datasource.seguridad.password=
spring.datasource.seguridad.driver-class-name=org.h2.Driver

# JPA/Hibernate para tests
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false

# JWT Secret para tests (mínimo 32 chars para HMAC256)
jwt.secret=test-secret-key-for-integration-tests-only-32chars-minimum

# Server
server.port=0

# Desactivar inicialización automática
spring.sql.init.mode=never

# Logging para tests
logging.level.com.fabribat.apiNomina=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG